name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores só de CI: o banco é descartável e o secret não protege nada real.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reservas_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-1234
      JWT_EXPIRATION_MINUTES: "15"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Gera os tipos globais do Next (LayoutProps, PageProps), que o tsc usa.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

      # Informativo por enquanto: revisamos o resultado antes de torná-lo bloqueante.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
